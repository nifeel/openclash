# 共用配置：Clash Verge（桌面）与 OpenClash（路由器）通用
# ---------------------------------------------------------------
# 多机场订阅：下面 proxy-providers 里每个 airportN 对应一个机场。
# 两端各自“只补链接”——把每个 airportN 的 url 换成你自己的订阅地址即可。
# 不含 token，可放公开仓库；真实订阅地址只在本地填写，不要提交回仓库。
#
# 想加更多机场：复制一段 airportN，改名字（airport3、airport4…）和 url、
# additional-prefix，并把它加进下面每个节点组的 use: 列表即可。
# ---------------------------------------------------------------
# 注意：
#   1) 需使用 Meta (Mihomo) 内核。
#   2) 路由器上 PROCESS-NAME 规则不生效，已用 GEOSITE,CN + GEOIP,CN 兜底。
#   3) 端口 / TUN / DNS / external-controller / allow-lan 交给各自客户端管理。

mode: rule

proxy-providers:
  airport1:
    type: http
    url: "REPLACE_WITH_SUBSCRIPTION_URL_1"
    interval: 86400
    path: ./providers/airport1.yaml
    additional-prefix: '[订阅1] '
    exclude-filter: (?i)(剩余|套餐|官网|重置)
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
  airport2:
    type: http
    url: "REPLACE_WITH_SUBSCRIPTION_URL_2"
    interval: 86400
    path: ./providers/airport2.yaml
    additional-prefix: '[订阅2] '
    exclude-filter: (?i)(剩余|套餐|官网|重置)
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: 🚀 节点选择
    type: select
    use:
      - airport1
      - airport2
    proxies:
      - DIRECT
  - name: 🇺🇸 限制区域
    type: select
    use:
      - airport1
      - airport2
    proxies:
      - 🚀 节点选择
      - DIRECT
  - name: 🤖 AI
    type: select
    use:
      - airport1
      - airport2
    exclude-filter: (?i)(香港|Hong\s*kong|HK)
    proxies:
      - 🚀 节点选择
      - DIRECT
  - name: 👨🏿‍💻 GitHub
    type: select
    use:
      - airport1
      - airport2
    proxies:
      - 🚀 节点选择
      - DIRECT
  - name: 🍀 Google
    type: select
    use:
      - airport1
      - airport2
    proxies:
      - 🚀 节点选择
      - DIRECT
  - name: 📹 YouTube
    type: select
    use:
      - airport1
      - airport2
    proxies:
      - 🚀 节点选择
      - DIRECT
  - name: 🎥 Netflix
    type: select
    use:
      - airport1
      - airport2
    proxies:
      - 🚀 节点选择
      - DIRECT
  - name: 📲 Telegram
    type: select
    use:
      - airport1
      - airport2
    proxies:
      - 🚀 节点选择
      - DIRECT
  - name: 🎵 TikTok
    type: select
    use:
      - airport1
      - airport2
    proxies:
      - 🚀 节点选择
      - DIRECT
  - name: 漏网之鱼
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - 🇺🇸 限制区域

rule-providers:
  my_direct:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/nifeel/openclash/main/verge/my_direct.list"
    path: ./ruleset/my_direct.list
    interval: 86400
    format: text
  must_us:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/nifeel/openclash/main/verge/must_us.list"
    path: ./ruleset/must_us.list
    interval: 86400
    format: text
  proxy_lite:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/nifeel/openclash/main/verge/proxy_lite.list"
    path: ./ruleset/proxy_lite.list
    interval: 86400
    format: text
  ai:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/nifeel/openclash/main/verge/ai.list"
    path: ./ruleset/ai.list
    interval: 86400
    format: text
  ban:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/nifeel/openclash/main/verge/ban.list"
    path: ./ruleset/ban.list
    interval: 86400
    format: text
  github:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list"
    path: ./ruleset/github.list
    interval: 86400
    format: text
  google:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.list"
    path: ./ruleset/google.list
    interval: 86400
    format: text
  youtube:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list"
    path: ./ruleset/youtube.list
    interval: 86400
    format: text
  netflix:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list"
    path: ./ruleset/netflix.list
    interval: 86400
    format: text
  telegram:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list"
    path: ./ruleset/telegram.list
    interval: 86400
    format: text
  tiktok:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.list"
    path: ./ruleset/tiktok.list
    interval: 86400
    format: text

# 具体规则都写在各自的 list 里（见 rule-providers），yaml 只做 RULE-SET 引用。
# - 进程直连(微信/tailscale/steam/todesk 等) 和国内直连域名 => verge/my_direct.list
# - 强制走代理的域名(microsoft/google/gstatic/yahoo 等)             => verge/proxy_lite.list
rules:
  - RULE-SET,my_direct,DIRECT
  - RULE-SET,must_us,🇺🇸 限制区域
  - RULE-SET,proxy_lite,🚀 节点选择
  - RULE-SET,ai,🤖 AI
  - RULE-SET,ban,REJECT
  - RULE-SET,github,👨🏿‍💻 GitHub
  - RULE-SET,google,🍀 Google
  - RULE-SET,youtube,📹 YouTube
  - RULE-SET,netflix,🎥 Netflix
  - RULE-SET,telegram,📲 Telegram
  - RULE-SET,tiktok,🎵 TikTok
  # 兜底：国内域名/IP 直连（路由器上替代失效的进程名规则）
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,漏网之鱼
